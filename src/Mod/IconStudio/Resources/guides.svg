<?xml version="1.0" encoding="UTF-8"?>
<!--
  Default Icon Studio guide overlay.
  24x24 unit space (1 unit = 1 px). Stroke widths are sub-pixel so guides
  remain visible without overpowering the linework.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <g id="diagonals" stroke="#d040d0" stroke-width="0.04" fill="none">
    <line x1="0" y1="0" x2="24" y2="24"/>
    <line x1="24" y1="0" x2="0" y2="24"/>
  </g>
  <g id="grid-major" stroke="#000000" stroke-width="0.05" fill="none">
    <line x1="6" y1="0" x2="6" y2="24"/>
    <line x1="12" y1="0" x2="12" y2="24"/>
    <line x1="18" y1="0" x2="18" y2="24"/>
    <line x1="0" y1="6" x2="24" y2="6"/>
    <line x1="0" y1="12" x2="24" y2="12"/>
    <line x1="0" y1="18" x2="24" y2="18"/>
  </g>
  <g id="rounded-rects" stroke="#000000" stroke-width="0.05" fill="none">
    <rect x="1" y="1" width="22" height="22" rx="1" ry="1"/>
    <rect x="1" y="1" width="22" height="22" rx="2" ry="2"/>
    <rect x="1" y="1" width="22" height="22" rx="3" ry="3"/>
    <rect x="1" y="1" width="22" height="22" rx="4" ry="4"/>
    <rect x="1" y="1" width="22" height="22" rx="5" ry="5"/>
    <rect x="1" y="1" width="22" height="22" rx="6" ry="6"/>
  </g>
  <g id="circle" stroke="#000000" stroke-width="0.05" fill="none">
    <circle cx="12" cy="12" r="11"/>
  </g>
</svg>
